<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#1c0d24">
    <title>FALESC</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="preload" href="./assets/fonts/fraunces-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./assets/fonts/jost-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./assets/fonts/space-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./styles/main.css">
    <script type="importmap">
        {
            "imports": {
                "pixi.js": "./vendor/pixi.min.mjs"
            }
        }
    </script>
</head>
<body>
    <!-- Fixed warm-void backdrop. The Pixi canvas renders above this and is
         transparent, so the nebula stays visible past every floating shard. -->
    <div class="world-backdrop" id="world-backdrop" aria-hidden="true">
        <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="presentation">
            <defs>
                <linearGradient id="voidBase" x1="0" y1="0" x2="0.2" y2="1">
                    <stop offset="0" stop-color="#140a1d"/>
                    <stop offset="0.36" stop-color="#25102f"/>
                    <stop offset="0.68" stop-color="#3a163c"/>
                    <stop offset="1" stop-color="#1c0d24"/>
                </linearGradient>
                <radialGradient id="voidCore" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.78"/>
                    <stop offset="0.28" stop-color="#ffa07a" stop-opacity="0.34"/>
                    <stop offset="0.64" stop-color="#c73d61" stop-opacity="0.14"/>
                    <stop offset="1" stop-color="#3a163c" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="nebulaRose" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="0" stop-color="#ff4f9a" stop-opacity="0.22"/>
                    <stop offset="0.5" stop-color="#c73d61" stop-opacity="0.1"/>
                    <stop offset="1" stop-color="#3a163c" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="nebulaMint" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="0" stop-color="#59e3c2" stop-opacity="0.1"/>
                    <stop offset="0.55" stop-color="#36c6d9" stop-opacity="0.05"/>
                    <stop offset="1" stop-color="#1c0d24" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#59E3C2" stop-opacity="0"/>
                    <stop offset="0.35" stop-color="#A8F5DC" stop-opacity="0.16"/>
                    <stop offset="0.62" stop-color="#C9B6FF" stop-opacity="0.2"/>
                    <stop offset="1" stop-color="#C9B6FF" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="planetBody" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#5c2350"/>
                    <stop offset="0.55" stop-color="#3a163c"/>
                    <stop offset="1" stop-color="#221028"/>
                </linearGradient>
                <linearGradient id="shardFace" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#6b2a52"/>
                    <stop offset="0.7" stop-color="#3a163c"/>
                    <stop offset="1" stop-color="#221028"/>
                </linearGradient>
                <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
                    <feGaussianBlur stdDeviation="18"/>
                </filter>
                <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
                    <feGaussianBlur stdDeviation="2.2"/>
                </filter>
            </defs>

            <rect width="1600" height="900" fill="url(#voidBase)"/>
            <ellipse cx="940" cy="390" rx="520" ry="360" fill="url(#voidCore)" filter="url(#softBlur)"/>
            <ellipse cx="330" cy="240" rx="330" ry="220" fill="url(#nebulaRose)" filter="url(#softBlur)"/>
            <ellipse cx="1320" cy="640" rx="360" ry="230" fill="url(#nebulaMint)" filter="url(#softBlur)"/>

            <g class="scene__aurora" opacity="0.9">
                <path d="M-120 240 C 220 150, 460 280, 760 198 C 1010 130, 1290 214, 1720 160 L 1720 224 C 1280 286, 1020 206, 760 272 C 450 350, 190 232, -120 322 Z" fill="url(#aurora)" filter="url(#softBlur)"/>
                <path d="M-80 660 C 260 600, 520 690, 860 628 C 1150 576, 1410 650, 1720 606 L 1720 646 C 1400 700, 1130 626, 850 682 C 520 748, 220 660, -80 708 Z" fill="url(#aurora)" opacity="0.55" filter="url(#softBlur)"/>
            </g>

            <g class="scene__stars" fill="#FFF8EA">
                <circle cx="84" cy="110" r="1.2" opacity=".8"/><circle cx="150" cy="52" r="0.8" opacity=".5"/>
                <circle cx="206" cy="176" r="1.5" opacity=".9"/><circle cx="264" cy="86" r="0.7" opacity=".45"/>
                <circle cx="318" cy="136" r="1" opacity=".65"/><circle cx="372" cy="42" r="1.3" opacity=".8"/>
                <circle cx="440" cy="196" r="0.8" opacity=".5"/><circle cx="502" cy="104" r="1.6" opacity=".85"/>
                <circle cx="566" cy="58" r="0.9" opacity=".55"/><circle cx="620" cy="154" r="1.1" opacity=".7"/>
                <circle cx="688" cy="78" r="0.7" opacity=".4"/><circle cx="742" cy="206" r="1.4" opacity=".8"/>
                <circle cx="806" cy="44" r="1" opacity=".6"/><circle cx="872" cy="118" r="0.8" opacity=".5"/>
                <circle cx="934" cy="72" r="1.5" opacity=".9"/><circle cx="998" cy="166" r="0.7" opacity=".45"/>
                <circle cx="1064" cy="96" r="1.1" opacity=".7"/><circle cx="1128" cy="42" r="0.9" opacity=".55"/>
                <circle cx="1192" cy="152" r="1.3" opacity=".75"/><circle cx="1258" cy="84" r="0.7" opacity=".4"/>
                <circle cx="1322" cy="190" r="1.2" opacity=".8"/><circle cx="1390" cy="54" r="1" opacity=".6"/>
                <circle cx="1456" cy="138" r="0.8" opacity=".5"/><circle cx="1520" cy="76" r="1.4" opacity=".85"/>
                <circle cx="70" cy="330" r="0.8" opacity=".45"/><circle cx="138" cy="420" r="1.2" opacity=".7"/>
                <circle cx="198" cy="520" r="0.7" opacity=".4"/><circle cx="286" cy="360" r="1" opacity=".6"/>
                <circle cx="356" cy="470" r="1.4" opacity=".8"/><circle cx="430" cy="580" r="0.8" opacity=".5"/>
                <circle cx="510" cy="330" r="1.1" opacity=".65"/><circle cx="590" cy="430" r="0.7" opacity=".45"/>
                <circle cx="664" cy="560" r="1.3" opacity=".75"/><circle cx="738" cy="360" r="0.9" opacity=".55"/>
                <circle cx="820" cy="480" r="1.5" opacity=".85"/><circle cx="900" cy="300" r="0.7" opacity=".4"/>
                <circle cx="980" cy="420" r="1" opacity=".6"/><circle cx="1058" cy="540" r="0.8" opacity=".5"/>
                <circle cx="1132" cy="330" r="1.2" opacity=".7"/><circle cx="1210" cy="460" r="0.7" opacity=".45"/>
                <circle cx="1288" cy="370" r="1.4" opacity=".8"/><circle cx="1366" cy="500" r="0.9" opacity=".55"/>
                <circle cx="1444" cy="350" r="1" opacity=".6"/><circle cx="1520" cy="440" r="0.7" opacity=".4"/>
                <circle cx="66" cy="690" r="1.1" opacity=".65"/><circle cx="150" cy="760" r="0.8" opacity=".45"/>
                <circle cx="240" cy="830" r="1.4" opacity=".8"/><circle cx="330" cy="700" r="0.7" opacity=".4"/>
                <circle cx="430" cy="790" r="1" opacity=".6"/><circle cx="540" cy="850" r="1.2" opacity=".7"/>
                <circle cx="650" cy="720" r="0.8" opacity=".45"/><circle cx="760" cy="820" r="1.1" opacity=".65"/>
                <circle cx="870" cy="700" r="0.7" opacity=".4"/><circle cx="980" cy="800" r="1.3" opacity=".75"/>
                <circle cx="1090" cy="720" r="0.9" opacity=".55"/><circle cx="1200" cy="840" r="1" opacity=".6"/>
                <circle cx="1310" cy="760" r="0.8" opacity=".5"/><circle cx="1420" cy="830" r="1.2" opacity=".7"/>
                <circle cx="1530" cy="690" r="0.7" opacity=".4"/>
            </g>

            <g class="scene__stars scene__stars--bright" fill="#FFD36E" filter="url(#starGlow)">
                <circle cx="228" cy="262" r="2.4" opacity=".9"/><circle cx="694" cy="286" r="1.8" opacity=".7"/>
                <circle cx="1150" cy="250" r="2.1" opacity=".8"/><circle cx="1460" cy="300" r="1.7" opacity=".65"/>
                <circle cx="380" cy="618" r="2" opacity=".75"/><circle cx="1014" cy="640" r="1.9" opacity=".7"/>
                <circle cx="1240" cy="560" r="2.3" opacity=".8"/>
            </g>

            <g class="scene__planet" opacity="0.9">
                <ellipse cx="1318" cy="238" rx="104" ry="24" fill="none" stroke="#C9B6FF" stroke-opacity=".22" stroke-width="3" transform="rotate(-16 1318 238)"/>
                <circle cx="1318" cy="226" r="58" fill="url(#planetBody)"/>
                <path d="M1272 198a58 58 0 0 1 84-18" fill="none" stroke="#C9B6FF" stroke-opacity=".28" stroke-width="2"/>
                <ellipse cx="1318" cy="238" rx="124" ry="30" fill="none" stroke="#FFA07A" stroke-opacity=".14" stroke-width="1.5" transform="rotate(-16 1318 238)"/>
            </g>

            <g class="scene__shards" fill="url(#shardFace)" opacity="0.85">
                <path d="M86 772c42-18 86-14 120 12l-16 20c-28-16-52-18-84-6l-12 12-24-18Z"/>
                <path d="M120 812c30-12 58-8 78 10l-10 14c-18-10-34-10-52-2l-8 8-18-14Z" fill="#221028"/>
                <path d="M1390 690c30-14 64-10 90 10l-12 16c-22-12-40-14-64-4l-10 10-16-14Z"/>
                <path d="M470 96c18-10 38-8 52 4l-8 10c-12-6-22-6-34 0l-6 6-10-10Z"/>
            </g>

            <g class="scene__shards scene__shards--distant" fill="#221028" opacity="0.7">
                <path d="M640 660c24-12 50-10 70 4l-8 14c-18-8-32-8-48-2l-8 8-14-12Z"/>
                <path d="M1030 112c14-8 30-6 42 4l-6 10c-10-4-18-4-28 0l-6 4-8-10Z"/>
            </g>
        </svg>
        <div class="world-backdrop__grain"></div>
        <div class="world-backdrop__vignette"></div>
    </div>

    <script type="module" src="./src/App.js"></script>
</body>
</html>
